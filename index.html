<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewRoman</title>
    <link rel="stylesheet" href="/style.css"> </head>

<body>
    <div class="three" id="app" style="top: 0;"></div>
    <div class="logo">
        <img src="public/logo.png">
    </div>
    <img src="nuevo.png" alt="Micrófono" id="new">

    <img src="info.png" alt="Información" id="infoButton">

    <div id="infoModal">
        <div class="info-modal-content">
            <p class="grab-text"><span>Pulsa</span><br>para hablar</p>
            <div class="info-actions-row">
                <div class="info-action">
                    <div class="img">
                        <img src="public/micro.gif" alt="Grabar">
                    </div>
                    <div class="textT">
                        <span>Grabar</span>
                    </div>
                </div>
                <div class="info-action">
                    <div class="img">
                        <img src="public/stopR.gif" alt="Escuchando">
                    </div>
                    <div class="textT">
                        <span>Escuchando</span>
                    </div>
                </div>
                <div class="info-action">
                    <div class="img">
                        <img src="public/cancelR.gif" alt="Cancelar">
                    </div>
                    <div class="textT">
                        <span>Cancelar<br>Pregunta</span>
                    </div>
                </div>
                <div class="info-action-divider"></div>
                <div class="info-action">
                    <div class="img1">
                        <img src="public/enviar.png" alt="Enviar">
                    </div>
                    <div class="textT">
                        <span>Enviar<br>pregunta</span>
                    </div>
                </div>
                <div class="info-action">
                    <div class="img1">
                        <img src="public/nuevoC.png" alt="Nuevo Chat">
                    </div>
                    <div class="textT">
                        <span>Nuevo<br>chat</span>
                    </div>
                </div>
            </div>
            <img id="closeModal" src="public/next.png" alt="Cerrar" class="info-modal-close-btn" />
        </div>
    </div>

    <section class="column" id="slider-background">
        <div class="loaderStart" id="loaderStart">
            <img src="spinner.gif" alt="" srcset="">
        </div>
        <div id="sliderOverlay" class="slider-overlay"></div>
        <div class="sliderBody" id="sliderBody" style="display: none;">
            <div class="sliderTrack" id="sliderTrack">
                <div class="sliderCiruclo" id="sliderCiruclo">
                    <img src="/public/flecha.webp" alt="Flecha" class="sliderCirculoImagen" id="flechaIcon">
                    <img src="/public/iniciar.png" alt="Iniciar" class="sliderCirculoImagen" id="iniciarIcon">
                </div>
            </div>
            <h1 class="sliderTexto">Quiero hablar contigo</h1>
            <img src="/public/flechas.webp" alt="" class="sliderImagen" />
        </div>
    </section>

    <section class="transcription" id="Transcripcion">
        <div class="bloque">
            <div class="cajaD">
                <h2 id="supDialog">
                    Responde estas preguntas, por favor.
                </h2>
            </div>
            <div class="cajaT" style="display: none;">
                <div class="Text Respuesta" id="messageLabel">
                    </div>
                <div class="line"></div>
                <img src="micro.gif" id="micIcon" alt="Micrófono">
                <div class="expandWrapper" id="envCont">
                    <img src="enviar.png" id="sendBtn" alt="Enviar">
                </div>
            </div>
        </div>
    </section>

    <div id="tutorialOverlay" class="tutorial-overlay">
        </div>

        <div id="skipTutorialBtn" class="skip-tutorial-btn" style="display: none;">
            <p>
                Omitir
            </p>
            <img src="next.png" alt="Omitir Tutorial">
        </div>



    <script>
        let btn;
        let btn2;

        document.addEventListener('DOMContentLoaded', () => {
            const expandIcon = document.getElementById('expandIcon');
            const expandMenu = document.getElementById('expandMenu');
            const closeModal = document.getElementById('closeModal');
            let menuOpen = false;

            if (closeModal) {
                closeModal.addEventListener('click', () => {
                    modalVisible = false;
                    infoModal.style.bottom = '-100vh';
                });
            }

            if (expandIcon && expandMenu) {
                expandIcon.addEventListener('click', () => {
                    expandIcon.style.opacity = '0';
                    setTimeout(() => {
                        expandIcon.src = menuOpen ? 'expandir.png' : 'cerrar.png';
                        menuOpen = !menuOpen;
                        expandMenu.classList.toggle('open', menuOpen);
                        expandIcon.style.opacity = '1';
                    }, 400);
                });
            }

            const clearBtn = document.getElementById('clearBtn');
            if (clearBtn) {
                clearBtn.addEventListener('click', borrarTextArea);
            }

            const newEl = document.getElementById('new');
            if (newEl) {
                newEl.addEventListener('click', () => {
                    window.location.reload();
                });
            }

            const infoButton = document.getElementById('infoButton');
            const infoModal = document.getElementById('infoModal');
            let modalVisible = false;

            if (infoButton && infoModal) {
                infoButton.addEventListener('click', () => {
                    modalVisible = !modalVisible;
                    infoModal.style.bottom = modalVisible ? '0' : '-100vh';
                });
            }
        });

        function borrarTextArea() {
            const transcript = document.getElementById('transcript');
            const messageLabel = document.getElementById('messageLabel');

            if (transcript) transcript.value = '';
            if (messageLabel) messageLabel.innerHTML = '';
        }
    </script>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/Ollama.ts"></script>
    <script type="module" src="/src/recorder.js"></script>
    <script type="module" src="/src/SliderDrag.js"></script>
    <script type="module" src="/src/tutorial.js"></script> </body>

</html>
